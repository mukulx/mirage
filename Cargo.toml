[package]
name = "mirage-launcher"
version = "0.1.0-alpha.1"
edition = "2021"
description = "A fast terminal launcher for Minecraft"
license = "MIT"
readme = "README.md"
repository = "https://github.com/mukulx/mirage"
keywords = ["minecraft", "launcher", "tui", "modrinth"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "mirage"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
indicatif = "0.17"
sha2 = "0.10"
sha1 = "0.10"
uuid = { version = "1", features = ["v4", "v3", "v5"] }
base64 = "0.22"
chrono = "0.4"
url = "2"
crossterm = "0.29"
ratatui = "0.30.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }


[profile.dev]
debug = "line-tables-only"

[profile.release]
incremental = true
lto = false
codegen-units = 16

# Shipped binaries (`cargo build --profile dist`): smaller and faster than the
# quick local `release` profile above, at the cost of a slower build.
[profile.dist]
inherits = "release"
incremental = false
lto = "fat"
codegen-units = 1
strip = true
